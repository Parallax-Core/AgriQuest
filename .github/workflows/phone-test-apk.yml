name: Phone test APK

# Builds an installable APK from the phone-test branch for testing on a phone.
# It never publishes to Supabase, so teammates do not get an in-app update.
on:
  push:
    branches: [phone-test]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: write # needed to create the experimental GitHub release

concurrency:
  group: agriquest-phone-test
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/phone-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const names = ['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD','SUPABASE_URL','SUPABASE_ANON_KEY'];
          const missing = names.filter(name => !process.env[name]);
          if (missing.length) throw new Error('Missing repository secrets: ' + missing.join(', '));
          const encoded = process.env.ANDROID_KEYSTORE_BASE64.trim();
          const bytes = Buffer.from(encoded, 'base64');
          if (bytes.toString('base64') !== encoded) throw new Error('Invalid keystore Base64');
          const path = join(process.env.RUNNER_TEMP, 'AgriQuest-release.jks');
          writeFileSync(path, bytes, {mode: 0o600});
          const code = Math.floor(Date.now() / 1000) - 1704067200;
          if (code <= 1 || code >= 2100000000) throw new Error('Invalid release version clock');
          appendFileSync(process.env.GITHUB_ENV,
            `ANDROID_KEYSTORE_PATH=${path}\nAGRIQUEST_VERSION_CODE=${code}\nAGRIQUEST_VERSION_NAME=1.0.${code}\n`);
          JS
      - name: Build signed release and run lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --no-configuration-cache
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/AgriQuest.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release/AgriQuest.apk
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgriQuest-phone-test-${{ env.AGRIQUEST_VERSION_CODE }}
          path: release/AgriQuest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ env.AGRIQUEST_VERSION_CODE }}
          VERSION: ${{ env.AGRIQUEST_VERSION_NAME }}
        run: |
          tag="phone-test-$CODE"
          short_sha="$(git rev-parse --short HEAD)"
          cp release/AgriQuest.apk "release/AgriQuest-experimental-$VERSION.apk"
          gh release create "$tag" "release/AgriQuest-experimental-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Experimental $VERSION (phone-test @ $short_sha)" \
            --notes "⚠️ **Experimental build** from the \`phone-test\` branch for testing only. Not an official AgriQuest release, and it is not sent to the app's in-app updates.

          Commit: $GITHUB_SHA" \
            --prerelease --latest=false
          # Keep only the 5 newest experimental releases (and their tags).
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("phone-test-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/AgriQuest-release.jks"
